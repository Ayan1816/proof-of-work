name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/proof_of_work.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct/ -v

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x0F837232eD9Fde153101E8C51A2fBb9C2A367349"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
          NEXT_PUBLIC_GENLAYER_CHAIN_NAME: "GenLayer Studio"
          NEXT_PUBLIC_GENLAYER_SYMBOL: "GEN"

  test-integration:
    name: Studio Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install GenLayer CLI
        run: npm install -g genlayer
      - name: Initialize and start Studio
        env:
          CI: "true"
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY secret is empty; Studio cannot create LLM validators."
            echo "Skipping local Studio boot. Remaining CI jobs already passed."
            echo "SKIP_STUDIO=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Drive inquirer over a PTY: confirm, then space (select OpenAI),
          # pause, then enter. Sending space+enter together submits an empty
          # checkbox and later fails with "No providers available".
          # init already starts localnet — do not run `genlayer up` after.
          timeout 12m python3 scripts/ci_studio_init.py
      - name: Wait for Studio RPC
        if: env.SKIP_STUDIO != '1'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            if curl -sf http://127.0.0.1:4000/ready >/dev/null; then
              exit 0
            fi
            if curl -sf -X POST http://127.0.0.1:4000/api \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Studio did not become ready"
          exit 1
      - name: Run Studio-backed integration tests
        if: env.SKIP_STUDIO != '1'
        run: gltest tests/integration/test_proof_of_work.py tests/test_lifecycle.py -v -s --network localnet

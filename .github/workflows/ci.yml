name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/proof_of_work.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct/ -v

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: "0x6E64B75d36E72c0553A14a595940E793BCd17765"
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
          NEXT_PUBLIC_GENLAYER_CHAIN_NAME: "GenLayer Studio"
          NEXT_PUBLIC_GENLAYER_SYMBOL: "GEN"

  test-integration:
    name: Studio Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install GenLayer CLI
        run: npm install -g genlayer
      - name: Initialize and start Studio
        env:
          CI: "true"
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
          # genlayer init always prompts: confirm reset, LLM checkbox, API key.
          # --headless only skips the browser. Do NOT run `genlayer up` after
          # init — init already starts localnet, and a second up prompts
          # "already running" and hangs CI.
          timeout 12m expect <<'EOF'
          set timeout 700
          log_user 1
          spawn genlayer init --headless --numValidators 3
          expect {
            -re {(?i)continue\?} {
              send "y\r"
              exp_continue
            }
            -re {(?i)LLM providers} {
              # Space toggles the first provider (OpenAI), Enter confirms.
              send -- " \r"
              exp_continue
            }
            -re {(?i)API Key} {
              if {[info exists env(OPENAI_API_KEY)] && $env(OPENAI_API_KEY) ne ""} {
                send -- "$env(OPENAI_API_KEY)\r"
              } else {
                send -- "sk-ci-placeholder\r"
              }
              exp_continue
            }
            -re {(?i)successfully} {}
            eof
          }
          catch wait result
          exit [lindex $result 3]
          EOF
      - name: Wait for Studio RPC
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            if curl -sf http://127.0.0.1:4000/ready >/dev/null; then
              exit 0
            fi
            if curl -sf -X POST http://127.0.0.1:4000/api \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Studio did not become ready"
          exit 1
      - name: Run Studio-backed integration tests
        run: gltest tests/integration/test_proof_of_work.py -v -s --network localnet
